name: Feature request / 功能建议
description: 提出一个功能或改进建议 / Suggest a feature or improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，再谈方案。涉及隐私、密钥或安全闸门的建议，请特别注明。
        Describe the problem before the solution. Flag anything touching privacy,
        secrets or the safety gate.
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / Problem to solve
      description: 现在哪里不舒服？谁在什么场景下会遇到？/ What is painful today, for whom, and in what scenario?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
      description: 你希望它怎么工作？有没有更简单的替代方案？/ How should it work? Any simpler alternatives?
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: 是否愿意提交 PR / Willing to open a PR
      options:
        - 愿意，我可以直接提 PR / Yes, I can open a PR
        - 可以讨论后再提 / Maybe, after discussion
        - 暂时不 / Not for now
    validations:
      required: true
  - type: dropdown
    id: security
    attributes:
      label: 是否涉及安全边界 / Security boundary
      description: 例如危机闸门、密钥存储、记忆落盘、图片或数据出境。/ e.g. crisis gate, key storage, memory on disk, images or data leaving the device.
      options:
        - 否 / No
        - 是，涉及安全闸门或危机处理 / Yes, safety gate or crisis handling
        - 是，涉及密钥、记忆或数据出境 / Yes, secrets, memory or outbound data
        - 不确定 / Not sure
    validations:
      required: true
