<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olivia · 私人塔罗咨询师</title>
<style>
  :root{
    --bg:#12101a; --panel:#1c1927; --panel2:#252135; --line:#332e45;
    --ink:#efeaf7; --muted:#a89fc0; --accent:#b98cff; --accent2:#e8b9ff;
    --ok:#7fd6a8; --err:#ff9aa8; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(1200px 600px at 20% -10%,#2a2140 0%,transparent 60%),var(--bg);
    color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;justify-content:center;
  }
  .app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;padding:18px;gap:12px}
  header{display:flex;align-items:center;gap:12px;padding:4px 6px;flex-wrap:wrap}
  .avatar{width:42px;height:42px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-size:20px;box-shadow:0 4px 18px #b98cff44}
  .title b{font-size:17px;letter-spacing:.3px}
  .title small{display:block;color:var(--muted);font-size:12px}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);color:var(--ink);
    background:var(--panel2);border-radius:10px;padding:8px 14px;transition:.15s}
  button:hover{border-color:var(--accent);background:#2e2842}
  button:disabled{opacity:.5;cursor:not-allowed}
  .chip{font-size:12px;padding:5px 10px;color:var(--muted)}

  #chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:10px 4px 4px}
  .msg{display:flex;gap:10px;max-width:88%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .msg .bub{background:var(--panel);border:1px solid var(--line);padding:11px 15px;border-radius:var(--radius);white-space:pre-wrap;word-break:break-word}
  .msg.user .bub{background:linear-gradient(135deg,#5a3d86,#3c2c5e);border-color:#6b4a9c}
  .msg .who{font-size:11px;color:var(--muted);margin-bottom:2px}
  .meta-line{font-size:11px;color:var(--accent2);opacity:.8}

  .composer{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;gap:10px;align-items:flex-end}
  textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:var(--ink);font:inherit;min-height:44px;max-height:160px;padding:6px}
  textarea::placeholder{color:#6f6786}
  .send{background:linear-gradient(135deg,var(--accent),#9a6bff);border:0;color:#150d24;font-weight:600;padding:10px 18px;flex:0 0 auto}

  .overlay{position:fixed;inset:0;background:#0a0812cc;display:none;place-items:center;z-index:10;backdrop-filter:blur(4px)}
  .overlay.show{display:grid}
  .sheet{width:min(560px,92vw);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px}
  .sheet h2{margin:0 0 4px;font-size:19px}
  .sheet p.desc{margin:0 0 18px;color:var(--muted);font-size:13px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
  .field input,.field select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px 12px;font:inherit;outline:0}
  .field input:focus,.field select:focus{border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
  .primary{background:linear-gradient(135deg,var(--accent),#9a6bff);border:0;color:#150d24;font-weight:600}
  .note{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
  .status{font-size:12px;margin-top:10px;min-height:18px}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .doclist{font-size:12px;color:var(--muted);max-height:110px;overflow-y:auto;line-height:1.8;white-space:pre-wrap}
  .privacy{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar">✦</div>
    <div class="title"><b>Olivia · 奥莉薇娅</b><small>你的私人塔罗咨询师</small></div>
    <div class="spacer"></div>
    <span class="chip" id="backendChip">未配置</span>
    <button id="settingsBtn">设置</button>
    <button id="newBtn">新对话</button>
  </header>

  <div id="chat">
    <div class="msg assistant"><div><div class="who">Olivia</div><div class="bub">你好，我是 Olivia（奥莉薇娅）。坐吧，慢慢说——今天是什么把你带到我这儿来的？</div></div></div>
  </div>

  <div class="composer">
    <textarea id="input" placeholder="说说你的心事……（Enter 发送，Shift+Enter 换行）"></textarea>
    <button class="send" id="sendBtn">发送</button>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2>接入设置</h2>
    <p class="desc">填入你自己的 API key 与接口。设置只保存在这个浏览器的 localStorage，不上传、不经过任何中间服务器。</p>

    <div class="field">
      <label>预设</label>
      <select id="preset">
        <option value="deepseek-flash">DeepSeek Flash（快·省）</option>
        <option value="deepseek-v4-pro">DeepSeek V4 Pro（强）</option>
        <option value="deepseek-chat">DeepSeek Chat（旧版）</option>
        <option value="custom">自定义（OpenAI 兼容，需支持 CORS）</option>
      </select>
      <div class="note" id="presetNote"></div>
    </div>
    <div class="field"><label>接口地址 base_url</label><input id="baseUrl" placeholder="https://api.deepseek.com/v1"></div>
    <div class="row">
      <div class="field"><label>模型 model（可下拉选，也可手填）</label><input id="model" list="modelChoices" placeholder="deepseek-flash"><datalist id="modelChoices"><option value="deepseek-flash"><option value="deepseek-v4-pro"><option value="deepseek-chat"><option value="deepseek-reasoner"></datalist></div>
      <div class="field"><label>API key</label><input id="apiKey" type="password" placeholder="sk-…"></div>
    </div>
    <div class="row">
      <div class="field"><label>temperature</label><input id="temp" type="number" step="0.1" value="0.8"></div>
      <div class="field"><label>超时（秒）</label><input id="timeout" type="number" value="120"></div>
    </div>

    <div class="status" id="testStatus"></div>
    <div class="field" style="margin-top:14px">
      <label>已加载的专业资料（knowledge/）</label>
      <div class="doclist" id="docList">加载中…</div>
    </div>

    <div class="privacy">
      <b>关于隐私：</b>本站是纯静态页面，没有后端。你的对话和 API key 只在本地浏览器与所选 API 服务商之间传递，本站服务器不保存任何内容。Ollama 等本地模型无法在网页里直连（需本地代理），请用仓库里的本地版 <code>agent/</code>。
    </div>

    <div class="actions">
      <button id="testBtn">测试连接</button>
      <button id="closeBtn">取消</button>
      <button class="primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<script src="persona.js"></script>
<script src="knowledge.js"></script>
<script>
const $ = id => document.getElementById(id);
const chat = $('chat'), input = $('input');
const KEY = 'olivia_cfg_v1';
let history = [], streaming = false;

const PRESETS = {
  'deepseek-flash': {base_url:'https://api.deepseek.com/v1', model:'deepseek-flash',
    note:'DeepSeek V4.1-Flash：快、便宜，默认带思考。在 platform.deepseek.com 申请 API key。'},
  'deepseek-v4-pro': {base_url:'https://api.deepseek.com/v1', model:'deepseek-v4-pro',
    note:'DeepSeek V4-Pro：更强，适合复杂问题。填自己的 API key。'},
  'deepseek-chat': {base_url:'https://api.deepseek.com/v1', model:'deepseek-chat',
    note:'旧版 deepseek-chat，兼容老配置。填自己的 API key。'},
  custom: {base_url:'', model:'',
    note:'任意 OpenAI 兼容端点，必须允许来自本页面的跨域（CORS）请求。'}
};

function getCfg(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
function setCfg(c){ localStorage.setItem(KEY, JSON.stringify(c)); }

function addMsg(role, text){
  const wrap=document.createElement('div'); wrap.className='msg '+(role==='user'?'user':'assistant');
  const inner=document.createElement('div');
  const who=document.createElement('div'); who.className='who'; who.textContent=role==='user'?'你':'Olivia';
  const bub=document.createElement('div'); bub.className='bub'; bub.textContent=text;
  inner.appendChild(who); inner.appendChild(bub); wrap.appendChild(inner); chat.appendChild(wrap);
  chat.scrollTop=chat.scrollHeight;
  return {bub,inner};
}

function loadConfig(){
  const c=getCfg(); const key=c.preset||'deepseek-flash'; const p=PRESETS[key]||PRESETS['deepseek-flash'];
  $('preset').value=PRESETS[key]?key:'deepseek-flash';
  $('baseUrl').value=c.base_url||p.base_url;
  $('model').value=c.model||p.model;
  $('apiKey').value=c.api_key||'';
  $('temp').value=c.temperature??0.8;
  $('timeout').value=c.timeout??120;
  $('presetNote').textContent=p.note;
  $('backendChip').textContent=$('preset').value+(c.api_key?' · 就绪':' · 待填 key');
  const docs=window.KNOWLEDGE_DOCS||[];
  $('docList').textContent=docs.length?docs.map(d=>'· '+d.rel).join('\n'):'（暂无资料）';
}

$('preset').addEventListener('change',e=>{
  const p=PRESETS[e.target.value];
  $('baseUrl').value=p.base_url; $('model').value=p.model; $('presetNote').textContent=p.note;
});
$('settingsBtn').onclick=()=>{ loadConfig(); $('overlay').classList.add('show'); };
$('closeBtn').onclick=()=>$('overlay').classList.remove('show');
$('newBtn').onclick=()=>{ history=[]; chat.innerHTML=''; addMsg('assistant','新的一页。这次，你想从哪里说起？'); };

function collect(){ return {
  preset:$('preset').value, base_url:$('baseUrl').value.trim(), model:$('model').value.trim(),
  api_key:$('apiKey').value.trim(), temperature:parseFloat($('temp').value)||0.8,
  timeout:parseInt($('timeout').value)||120 }; }

$('saveBtn').onclick=()=>{ setCfg(collect()); loadConfig(); $('overlay').classList.remove('show'); };

function urlOf(cfg){
  let b=(cfg.base_url||'').trim().replace(/\/+$/,'');
  if(!/^https?:\/\//.test(b)) throw new Error('接口地址必须以 http(s):// 开头');
  return b+'/chat/completions';
}

$('testBtn').onclick=async()=>{
  const cfg=collect(); $('testStatus').className='status'; $('testStatus').textContent='测试中…';
  try{
    const r=await fetch(urlOf(cfg),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.api_key},
      body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:'只回复两个字：在线'}],stream:false})});
    if(!r.ok){ const t=await r.text(); throw new Error('HTTP '+r.status+' '+t.slice(0,200)); }
    const d=await r.json();
    $('testStatus').className='status ok'; $('testStatus').textContent='连接成功：'+(d.choices?.[0]?.message?.content||'OK');
  }catch(e){ $('testStatus').className='status err'; $('testStatus').textContent='失败：'+e.message; }
};

// ---- keyword retrieval (mirrors agent/knowledge.py) ----
const STOP=new Set('的 了 和 是 在 我 你 他 她 它 们 这 那 有 就 不 也 都 而 及 与 或 一个 什么 怎么 一些 可以 需要 是否 请 帮 我想 觉得 因为 所以 但是 如果 已经 还是 现在 自己'.split(' '));
function tokens(q){
  q=q.toLowerCase(); const t=new Set();
  (q.match(/[a-z0-9]{2,}/g)||[]).forEach(w=>{ if(!STOP.has(w)) t.add(w); });
  const han=q.match(/[\u4e00-\u9fff]/g)||[];
  for(let i=0;i<han.length-1;i++) t.add(han[i]+han[i+1]);
  han.forEach(c=>{ if(!STOP.has(c)) t.add(c); });
  return t;
}
function retrieve(query){
  const toks=tokens(query); const docs=window.KNOWLEDGE_DOCS||[];
  if(!toks.size||!docs.length) return {ctx:'',used:[]};
  const scored=[];
  docs.forEach(d=>{
    const text=d.text.toLowerCase(); let score=0;
    toks.forEach(t=>{ const c=text.split(t).length-1; if(c) score+=c*(t.length>=2?2:1); });
    const head=text.split('\n').slice(0,8).join('\n');
    toks.forEach(t=>{ if(head.includes(t)) score+=3; });
    if(score) scored.push({score,d});
  });
  scored.sort((a,b)=>b.score-a.score);
  let total=0; const parts=[],used=[];
  for(const {d} of scored){
    if(used.length>=3||total>=9000) break;
    let chunk=d.text; if(total+chunk.length>9000) chunk=chunk.slice(0,9000-total);
    parts.push('【资料：'+d.rel+'】\n'+chunk); used.push(d.rel); total+=chunk.length;
  }
  return {ctx:parts.join('\n\n'),used};
}

async function send(){
  if(streaming) return;
  const text=input.value.trim(); if(!text) return;
  const cfg=getCfg();
  if(!cfg.api_key){
    addMsg('assistant','请先点右上角「设置」，填入你自己的 API key。'); return;
  }
  input.value=''; addMsg('user',text); history.push({role:'user',content:text});
  const {bub,inner}=addMsg('assistant','');
  const meta=document.createElement('div'); meta.className='meta-line'; inner.insertBefore(meta,bub);
  const {ctx,used}=retrieve(text);
  if(used.length) meta.textContent='参考了资料：'+used.join('、');
  let system=window.PERSONA_TEXT||'你是一名专业的塔罗咨询师 Olivia。';
  if(ctx) system+='\n\n---\n以下是相关专业知识，做专业判断时以其为准，不要臆测；塔罗只用于打开话题与照见感受，风险评估/诊断/干预绝不从牌里来。\n\n'+ctx;
  const messages=[{role:'system',content:system},...history.slice(0,-1).slice(-20),{role:'user',content:text}];
  streaming=true; $('sendBtn').disabled=true; let full='';
  try{
    const r=await fetch(urlOf(cfg),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.api_key},
      body:JSON.stringify({model:cfg.model,messages,temperature:cfg.temperature,stream:true})});
    if(!r.ok){ const t=await r.text(); throw new Error('HTTP '+r.status+' '+t.slice(0,300)); }
    const reader=r.body.getReader(),dec=new TextDecoder(); let buf='';
    while(true){
      const {value,done}=await reader.read(); if(done) break;
      buf+=dec.decode(value,{stream:true}); let idx;
      while((idx=buf.indexOf('\n\n'))>=0){
        const block=buf.slice(0,idx); buf=buf.slice(idx+2);
        const line=block.split('\n').find(l=>l.startsWith('data:'));
        if(!line||line.slice(5).trim()==='[DONE]') continue;
        let obj; try{obj=JSON.parse(line.slice(5).trim())}catch(e){continue}
        const d=obj.choices?.[0]?.delta?.content;
        if(d){ full+=d; bub.textContent=full; chat.scrollTop=chat.scrollHeight; }
      }
    }
  }catch(e){ full+='\n[错误] '+e.message; bub.textContent=full; }
  if(!full) bub.textContent='（没有收到回复，请检查设置里的接口、模型和 key。）';
  history.push({role:'assistant',content:full});
  streaming=false; $('sendBtn').disabled=false;
}

$('sendBtn').onclick=send;
input.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,160)+'px';});
loadConfig();
</script>
</body>
</html>
